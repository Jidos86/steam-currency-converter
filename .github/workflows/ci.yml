name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Check manifest versions match
        run: |
          node -e "const p=require('./package.json'),m=require('./plugin.json');if(p.version!==m.version){throw new Error('package.json '+p.version+' != plugin.json '+m.version)}"

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Parse Lua backend
        run: npx --yes luaparse backend/main.lua > /dev/null

      - name: Package plugin
        run: |
          set -eu
          name="steam-currency-converter"
          staging="dist/${name}"
          mkdir -p "$staging"
          cp -r plugin.json README.md LICENSE backend .millennium "$staging/"
          (cd dist && zip -r "../${name}.zip" "${name}")

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: steam-currency-converter
          path: steam-currency-converter.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: steam-currency-converter.zip
          generate_release_notes: true
